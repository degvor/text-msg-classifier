# The previous compose file could not build: bitnami/spark:3.4.1 has been
# removed from Docker Hub. It also ran Kafka on ZooKeeper (removed in Kafka 4),
# carried the obsolete `version:` key, bind-mounted a ./test_data directory that
# does not exist, hardcoded credentials in five places, and published Postgres
# and Kafka to the host.

name: streamcls

x-postgres-env: &postgres-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-streamdb}
  POSTGRES_USER: ${POSTGRES_USER:-streamuser}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: ${KAFKA_TOPIC:-posts}

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamdb}
      POSTGRES_USER: ${POSTGRES_USER:-streamuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamuser} -d ${POSTGRES_DB:-streamdb}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # KRaft mode: no ZooKeeper. ZooKeeper was deprecated in Kafka 3.5 and removed
  # in 4.0, and it was an entire service carried for nothing.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Experiments run on one partition so micro-batch composition is
      # deterministic. Scalability benchmarks override this explicitly.
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-1}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 48
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # A real standalone cluster, behind a profile. The default `local[4]` path is
  # what every reported experiment uses, because a pinned core count is what
  # makes model fitting reproducible; the cluster exists for the scalability
  # measurements, where `docker compose up --scale spark-worker=N` is the knob.
  #
  # The previous project claimed a distributed pipeline while setting no
  # .master() at all and launching the consumer with plain `python3` rather than
  # spark-submit -- so it ran local[*] in one JVM.
  #
  # `image:` names the tag that consumer and trainer build FROM. Compose does
  # not order builds by FROM and skips profiled services in `compose build`, so
  # the Makefile builds this image first (`make spark-image`).
  spark-master:
    image: streamcls/spark:dev
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    profiles: [cluster]
    # Launched through spark-class rather than sbin/start-master.sh: the pip
    # pyspark wheel ships bin/ and jars/ but only a subset of sbin/, so the
    # daemon wrappers are absent. spark-class is what they call anyway, and
    # running in the foreground is what a container wants.
    command:
      - spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "${SPARK_UI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-worker:
    image: streamcls/spark:dev
    profiles: [cluster]
    command:
      - spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "${SPARK_WORKER_CORES:-2}"
      - --memory
      - "${SPARK_WORKER_MEMORY:-2g}"
      # Defaults to $SPARK_HOME/work, which is inside site-packages and not
      # writable by the non-root user the image runs as.
      - --work-dir
      - /tmp/spark-work
    depends_on:
      spark-master:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      <<: *postgres-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      STREAMCLS_DATA_ROOT: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/admin/login/')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: docker/producer.Dockerfile
    environment:
      <<: [*postgres-env, *kafka-env]
      STREAMCLS_DATA_ROOT: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Wait for migrations, so the producer never reads a half-built schema.
      web:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: docker/consumer.Dockerfile
    environment:
      <<: [*postgres-env, *kafka-env]
      STREAMCLS_DATA_ROOT: /data
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_MASTER: ${SPARK_MASTER:-local[4]}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      web:
        condition: service_healthy
    # The old spark service had no restart policy at all, so the first
    # unhandled exception was a permanent outage.
    restart: unless-stopped

  # The adaptation loop's other half: claims drift-triggered retrain jobs.
  # Separate from the consumer on purpose -- forking a second Spark JVM inside a
  # container already running a streaming query would contend for the memory and
  # cores whose throughput is being measured.
  trainer-worker:
    build:
      context: .
      dockerfile: docker/trainer.Dockerfile
    command: ["python3", "-m", "services.trainer.worker"]
    environment:
      <<: *postgres-env
      STREAMCLS_DATA_ROOT: /data
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  # Behind a profile: training is an explicit action, not something that runs
  # on `up`. Shares the Spark base image with the consumer, so Spark and jar
  # versions are pinned in exactly one place.
  trainer:
    build:
      context: .
      dockerfile: docker/trainer.Dockerfile
    profiles: [manual]
    environment:
      <<: *postgres-env
      STREAMCLS_DATA_ROOT: /data
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  kafka_data:
