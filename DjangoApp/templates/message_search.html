<!DOCTYPE html>
<html>
<head>
    <title>Search Classified Messages</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f7f7f7; }

        nav button {
            padding: 10px 20px;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        nav button:hover {
            background-color: #0056b3;
        }

        .card {
            background: white;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
        }

        input, select {
            padding: 6px;
            margin-right: 10px;
        }

        button {
            padding: 6px 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/stream/"><button>⬅ Back to Stream Control</button></a>
    </nav>

    <div class="card">
        <h1>Пошук класифікованих повідомлень</h1>

        <input type="text" id="search-text" placeholder="Пошук за текстом...">
        <select id="category-filter">
            <option value="">Усі категорії</option>
        </select>
        <button onclick="performSearch()">🔍 Пошук</button>

        <table>
            <thead>
                <tr>
                    <th>Час</th>
                    <th>Категорія</th>
                    <th>Текст</th>
                    <th>Канал</th>
                    <th>Перегляди</th>
                </tr>
            </thead>
            <tbody id="results-body"></tbody>
        </table>
    </div>

    <script>
        function loadCategories() {
            fetch("/categories/")
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById("category-filter");
                    data.categories.forEach(cat => {
                        const opt = document.createElement("option");
                        opt.value = cat.id;
                        opt.textContent = cat.label;
                        select.appendChild(opt);
                    });
                });
        }

        function performSearch() {
            const q = document.getElementById("search-text").value;
            const cat = document.getElementById("category-filter").value;
            const params = new URLSearchParams();
            if (q) params.append("q", q);
            if (cat) params.append("category", cat);

            fetch("/search-messages/?" + params.toString())
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById("results-body");
                    tbody.innerHTML = "";
                    data.messages.forEach(msg => {
                        const row = `
                            <tr>
                                <td>${msg.PostCreatedAt}</td>
                                <td>${msg.category_label}</td>
                                <td>${msg.PostText}</td>
                                <td>${msg.ChannelTitle}</td>
                                <td>${msg.PostViewCount}</td>
                            </tr>`;
                        tbody.innerHTML += row;
                    });
                });
        }

        loadCategories();
        performSearch();
    </script>
</body>
</html>
