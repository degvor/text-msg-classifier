<!DOCTYPE html>
<html>
<head>
    <title>Stream Control</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f7f7f7; }

        nav {
            margin-bottom: 20px;
        }

        nav button, .stream-btn {
            margin-right: 10px;
            padding: 10px 20px;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        nav button:hover, .stream-btn:hover {
            background-color: #0056b3;
        }

        .row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: stretch;
            margin-bottom: 20px;
        }

        .card, .table-card, .stream-card {
            background: white;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .table-card {
            flex: 2;
            max-height: 320px;
            overflow-y: auto;
        }

        .card ul {
            list-style: none;
            padding-left: 0;
        }

        .card label {
            display: block;
            margin-top: 10px;
        }

        .card input[type="number"] {
            width: 100%;
            padding: 6px;
        }

        .card button {
            margin-top: 10px;
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #alert-box {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }

        .charts-row {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        canvas {
            background: white;
            border: 1px solid #ccc;
            padding: 5px;
            border-radius: 8px;
        }

        #categoryChart {
            width: 700px !important;
            height: 700px !important;
        }

        #throughputChart {
            width: 1100px !important;
            height: 500px !important;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
        }

        .category-cell {
            color: white;
            text-align: center;
            font-weight: bold;
        }

        .stream-status {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .stream-status span.active { color: green; margin-left: 10px; }
        .stream-status span.inactive { color: red; margin-left: 10px; }

        .stream-btn {
            font-size: 18px;
            padding: 12px 24px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .stream-btn:hover {
            background-color: #e07b00;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<nav>
    <a href="/category-settings/"><button>Категорії</button></a>
    <a href="/search/"><button>Пошук повідомлень</button></a>
    <a href="/performance/"><button>Логи продуктивності</button></a>
</nav>

<div class="row">
    <div class="stream-card">
        <div class="stream-status">
            Stream Processing is:
            <span class="{{ control.is_active|yesno:'active,inactive' }}">
                {{ control.is_active|yesno:"ACTIVE,INACTIVE" }}
            </span>
        </div>
        <form action="{% url 'toggle_stream' %}" method="post" style="margin-top: auto;">
            {% csrf_token %}
            <button class="stream-btn" type="submit">
                {% if control.is_active %} Stop Stream{% else %} Start Stream{% endif %}
            </button>
        </form>
    </div>

    <div class="card" style="flex: 1.5">
        <h3>Налаштування</h3>
        <form id="config-form">
            <label>Макс. довжина:</label>
            <input type="number" id="max-length" value="500">
            <label>Пропускна здатність:</label>
            <input type="number" id="throughput-limit" value="20">
            <button type="submit">Зберегти</button>
        </form>
    </div>
</div>

<div class="row">
    <div class="card">
        <h3>Статистика обробки</h3>
        <ul>
            <li><strong>Час:</strong> <span id="uptime">--</span></li>
            <li><strong>Отримано:</strong> <span id="received">--</span></li>
            <li><strong>Класифіковано:</strong> <span id="classified">--</span></li>
            <li><strong>Пропускна здатність:</strong> <span id="throughput">--</span> msg/sec</li>
            <li><strong>Ліміт:</strong> <span id="limit">--</span></li>
        </ul>
        <div id="alert-box"></div>
    </div>

    <div class="table-card">
        <h3>Останні повідомлення</h3>
        <table>
            <thead>
                <tr>
                    <th>Час</th>
                    <th>Категорія</th>
                    <th>Текст</th>
                </tr>
            </thead>
            <tbody id="message-body"></tbody>
        </table>
    </div>
</div>

<div class="charts-row">
    <canvas id="categoryChart"></canvas>
    <canvas id="throughputChart"></canvas>
</div>

<script>
    function fetchLatestMessages() {
        fetch("{% url 'latest_messages_json' %}")
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById("message-body");
                tbody.innerHTML = "";
                data.messages.forEach(msg => {
                    const row = `
                        <tr>
                            <td>${msg.PostCreatedAt}</td>
                            <td class="category-cell" style="background:${msg.category_color || '#999'}">
                                ${msg.category_label}
                            </td>
                            <td>${msg.PostText}</td>
                        </tr>`;
                    tbody.innerHTML += row;
                });
            });
    }

    function formatUptime(seconds) {
        const mins = Math.floor(seconds / 60);
        const hrs = Math.floor(mins / 60);
        const secs = seconds % 60;
        return `${hrs}h ${mins % 60}m ${secs}s`;
    }

    function fetchStreamMetrics() {
        fetch("{% url 'stream_metrics_json' %}")
            .then(res => res.json())
            .then(data => {
                document.getElementById("uptime").textContent = formatUptime(data.uptime_seconds);
                document.getElementById("received").textContent = data.received_count;
                document.getElementById("classified").textContent = data.classified_count;
                document.getElementById("throughput").textContent = data.current_throughput;
                document.getElementById("limit").textContent = data.throughput_limit;

                const alertBox = document.getElementById("alert-box");
                alertBox.textContent = data.status === "slow" ? "⚠️ Пропускна здатність нижча за ліміт!" : "";
            });
    }

    document.getElementById("config-form").addEventListener("submit", function(e) {
        e.preventDefault();
        const maxLen = document.getElementById("max-length").value;
        const throughput = document.getElementById("throughput-limit").value;

        fetch("/update-config/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                max_message_length: parseInt(maxLen),
                throughput_limit: parseInt(throughput)
            })
        });
    });

    let categoryChart, throughputChart;

    function fetchCategoryChart() {
        fetch("{% url 'chart_category_distribution' %}")
            .then(res => res.json())
            .then(data => {
                const labels = data.data.map(item => item.label);
                const values = data.data.map(item => item.value);
                const colors = data.data.map(item => item.color);

                if (categoryChart) {
                    categoryChart.data.labels = labels;
                    categoryChart.data.datasets[0].data = values;
                    categoryChart.data.datasets[0].backgroundColor = colors;
                    categoryChart.update();
                } else {
                    const ctx = document.getElementById('categoryChart').getContext('2d');
                    categoryChart = new Chart(ctx, {
                        type: 'pie',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Категорії',
                                data: values,
                                backgroundColor: colors
                            }]
                        }
                    });
                }
            });
    }

    function fetchThroughputChart() {
        fetch("{% url 'chart_throughput_data' %}")
            .then(res => res.json())
            .then(data => {
                const labels = data.data.map(d => new Date(d.time).toLocaleTimeString());
                const values = data.data.map(d => d.value);

                if (throughputChart) {
                    throughputChart.data.labels = labels;
                    throughputChart.data.datasets[0].data = values;
                    throughputChart.update();
                } else {
                    const ctx = document.getElementById('throughputChart').getContext('2d');
                    throughputChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Продуктивність (msg/sec)',
                                data: values,
                                tension: 0.3,
                                borderWidth: 2
                            }]
                        },
                        options: {
                            scales: {
                                y: { beginAtZero: true }
                            }
                        }
                    });
                }
            });
    }

    setInterval(() => {
        fetchCategoryChart();
        fetchThroughputChart();
    }, 5000);

    setInterval(fetchLatestMessages, 5000);
    setInterval(fetchStreamMetrics, 5000);

    fetchCategoryChart();
    fetchThroughputChart();
    fetchLatestMessages();
    fetchStreamMetrics();
</script>
</body>
</html>
